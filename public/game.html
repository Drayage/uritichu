<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 티츄 🎮</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="game-root">
    <!-- Top bar -->
    <div id="top-bar">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:22px;">🀄</span>
        <span style="font-weight:800; color:var(--lavender-dark);">우리 티츄</span>
      </div>
      <div id="status-bar">대기 중...</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div id="wish-indicator">⭐ 소원: <span id="wish-rank-text"></span></div>
        <button class="btn btn-secondary" id="btn-tichu" style="display:none; font-size:13px; padding:8px 16px;">티츄!</button>
      </div>
    </div>

    <!-- Table area -->
    <div id="table-area">
      <div id="table">
        <!-- Player zones: north, west, east, south (me) -->
        <div class="player-zone north" id="zone-north">
          <div class="player-info">
            <div class="player-avatar" id="avatar-north">?</div>
            <div class="player-name" id="name-north">-</div>
            <div id="tichu-badge-north"></div>
            <div class="player-hand-count"><span id="count-north">-</span>장</div>
          </div>
          <div class="opponent-cards" id="hand-north"></div>
        </div>
        <div class="player-zone west" id="zone-west">
          <div class="player-info">
            <div class="player-avatar" id="avatar-west">?</div>
            <div class="player-name" id="name-west">-</div>
            <div id="tichu-badge-west"></div>
            <div class="player-hand-count"><span id="count-west">-</span>장</div>
          </div>
          <div class="opponent-cards" id="hand-west"></div>
        </div>
        <div class="player-zone east" id="zone-east">
          <div class="player-info">
            <div class="player-avatar" id="avatar-east">?</div>
            <div class="player-name" id="name-east">-</div>
            <div id="tichu-badge-east"></div>
            <div class="player-hand-count"><span id="count-east">-</span>장</div>
          </div>
          <div class="opponent-cards" id="hand-east"></div>
        </div>
        <div class="player-zone south" id="zone-south" style="display:none;">
          <!-- Human player is in hand-area, not here -->
        </div>

        <!-- Trick area (center) -->
        <div id="trick-area"></div>
      </div>
    </div>

    <!-- Hand area (my cards) -->
    <div id="hand-area">
      <div class="hand-top-row">
        <div class="hand-label">내 패 <span id="my-hand-count" style="color:var(--lavender-dark);">0</span>장</div>
        <div id="hand-sort-bar" style="display:flex;gap:4px;">
          <button class="sort-btn active" data-sort="rank" onclick="window._setSortMode('rank')">숫자순</button>
          <button class="sort-btn"        data-sort="suit" onclick="window._setSortMode('suit')">모양순</button>
        </div>
        <div style="display:flex; align-items:center; gap:5px;">
          <div class="player-avatar" id="avatar-me" style="width:34px; height:34px; font-size:16px;">🙂</div>
          <span id="name-me" style="font-weight:700; font-size:12px; color:var(--text);">나</span>
          <div id="tichu-badge-me"></div>
        </div>
      </div>
      <div id="my-hand"></div>
      <div class="hand-actions">
        <button class="btn btn-primary" id="btn-play" disabled>▶ 내기</button>
        <button class="btn btn-secondary" id="btn-pass" disabled>패스</button>
        <span id="selected-info" style="font-size:13px; color:var(--text-light); margin-left:8px;"></span>
      </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
      <div class="panel score-panel" style="padding:14px;">
        <h3>점수판</h3>
        <div class="score-row team-a">
          <span>🌿 팀 A</span>
          <span class="score-points" id="score-a">0</span>
        </div>
        <div class="score-row team-b">
          <span>💜 팀 B</span>
          <span class="score-points" id="score-b">0</span>
        </div>
      </div>
      <div class="panel" style="padding:14px; flex:1;">
        <h3 style="font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-light); margin-bottom:8px;">게임 로그</h3>
        <div class="log-area" id="log-area"></div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <!-- Grand Tichu -->
  <div class="modal-overlay" id="modal-grand-tichu" style="display:none;">
    <div class="modal">
      <div style="font-size:40px; margin-bottom:8px;">👑</div>
      <h2>라지 티츄!</h2>
      <p>처음 8장을 보고 콜할지 결정하세요.<br><b style="color:#c8900a;">성공: +200점 / 실패: -200점</b></p>
      <div id="grand-tichu-sort" class="sort-bar" style="justify-content:center; margin:8px 0 0;"></div>
      <div id="grand-tichu-hand" class="modal-hand" style="justify-content:center;"></div>
      <div class="timer-bar"><div class="timer-fill" id="grand-tichu-timer" style="width:100%;"></div></div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-danger btn-full" id="btn-grand-tichu-yes">👑 라지 티츄!</button>
        <button class="btn btn-secondary btn-full" id="btn-grand-tichu-no">패스</button>
      </div>
    </div>
  </div>

  <!-- Exchange -->
  <div class="modal-overlay" id="modal-exchange" style="display:none;">
    <div class="modal" style="max-width:520px;">
      <div style="font-size:32px; margin-bottom:8px;">🎁</div>
      <h2>카드 교환</h2>
      <p>각 플레이어에게 1장씩 나눠주세요</p>
      <div class="exchange-slots" id="exchange-slots"></div>
      <div style="display:flex;justify-content:center;margin:6px 0 2px;">
        <div class="sort-bar">
          <button class="sort-btn active" data-sort="rank" onclick="window._setSortMode('rank')">숫자순</button>
          <button class="sort-btn"        data-sort="suit" onclick="window._setSortMode('suit')">모양순</button>
        </div>
      </div>
      <div id="exchange-hand" class="modal-hand"></div>
      <div id="exchange-status" style="font-size:13px; color:var(--text-light); margin-bottom:12px;"></div>
      <button class="btn btn-primary btn-full" id="btn-exchange-confirm" disabled>✅ 교환 완료</button>
    </div>
  </div>

  <!-- Dragon Give -->
  <div class="modal-overlay" id="modal-dragon" style="display:none;">
    <div class="modal">
      <div style="font-size:40px; margin-bottom:8px;">🐉</div>
      <h2>용 트릭 양도</h2>
      <p>상대팀 플레이어에게 이 트릭을 주세요</p>
      <div id="dragon-opponents" style="display:flex; gap:12px; justify-content:center; margin:16px 0;"></div>
    </div>
  </div>

  <!-- Wish -->
  <div class="modal-overlay" id="modal-wish" style="display:none;">
    <div class="modal">
      <div style="font-size:40px; margin-bottom:8px;">⭐</div>
      <h2>소원을 말해요!</h2>
      <p>참새를 내고 숫자를 지정하면, 상대가 그 숫자를 내야 해요</p>
      <div class="rank-grid" id="wish-rank-grid"></div>
      <button class="btn btn-secondary btn-full" id="btn-wish-none">소원 없음</button>
    </div>
  </div>

  <!-- Round Over -->
  <div class="modal-overlay" id="modal-round-over" style="display:none;">
    <div class="modal">
      <div style="font-size:40px; margin-bottom:8px;">🎊</div>
      <h2>라운드 종료!</h2>
      <div id="round-result" style="margin:16px 0;"></div>
      <button class="btn btn-primary btn-full" id="btn-next-round">다음 라운드 →</button>
    </div>
  </div>

  <!-- Game Over -->
  <div class="modal-overlay" id="modal-game-over" style="display:none;">
    <div class="modal">
      <div style="font-size:56px; margin-bottom:8px;" id="game-over-emoji">🏆</div>
      <h2 id="game-over-title">게임 종료!</h2>
      <div id="game-over-scores" style="margin:16px 0;"></div>
      <button class="btn btn-primary btn-full" onclick="location.href='./index.html'">🏠 로비로 돌아가기</button>
    </div>
  </div>

  <script type="module" src="js/game-client.js"></script>
</body>
</html>
